name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run from the Actions tab (or `gh workflow run release.yml`):
  # builds, packs and smoke-tests every platform, and publishes nothing.
  # Use it before tagging, e.g. for the darwin-x64 leg under Rosetta.
  workflow_dispatch:

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches manifest version
        # A dry run has no tag to check.
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TABULARIUM_VERSION=$(jq -r .version .tabularium)

          if [ "$TAG_VERSION" != "$TABULARIUM_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match .tabularium version ($TABULARIUM_VERSION)"
            exit 1
          fi

  build:
    name: ${{ matrix.platform-label }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # platform-label is the registry platform key. The registry maps each
        # release asset to a platform by its file name
        # (surrealdb-plugin-<platform-label>.zip), and Tabularis picks the
        # asset whose key matches the machine it runs on.
        include:
          - platform-label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: zip
            binary-suffix: ""
          - platform-label: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: zip
            binary-suffix: ""
            cross: true
          # Both macOS legs run on macos-latest (Apple Silicon). darwin-x64 is
          # cross-compiled there and its smoke test runs under Rosetta 2,
          # which the arm64 runner images include. macos-14 is not used: GitHub
          # retires that image on 2026-11-02 and fails jobs on it during the
          # brownouts before then (actions/runner-images#13518).
          - platform-label: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
            archive: zip
            binary-suffix: ""
          - platform-label: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: zip
            binary-suffix: ""
          - platform-label: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary-suffix: ".exe"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux-arm64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          STAGE=staging
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/surrealdb-plugin${{ matrix.binary-suffix }} "$STAGE/"
          cp .tabularium "$STAGE/"
          (cd "$STAGE" && zip -r ../surrealdb-plugin-${{ matrix.platform-label }}.zip .)

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\surrealdb-plugin${{ matrix.binary-suffix }}" $stage
          Copy-Item ".tabularium" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "surrealdb-plugin-${{ matrix.platform-label }}.zip"

      # linux-arm64 is cross-compiled via `cross` on an x86_64 runner — that
      # binary is a foreign architecture and cannot execute here without
      # QEMU emulation, so this leg is skipped rather than adding that
      # complexity for one platform.
      - name: Smoke test binary (unix)
        if: runner.os != 'Windows' && !matrix.cross
        run: |
          response=$(echo '{"jsonrpc":"2.0","method":"initialize","id":1}' | ./staging/surrealdb-plugin${{ matrix.binary-suffix }})
          echo "$response"
          echo "$response" | jq -e 'has("error") | not' > /dev/null || {
            echo "::error::Binary did not return a valid initialize response"
            exit 1
          }

      # Tabularis builds its own Linux packages against glibc 2.35 (Ubuntu
      # 22.04) so they run on older LTS distros. The plugin is built on
      # ubuntu-latest, so check that it needs no newer glibc than the host
      # does. readelf reads both x86_64 and aarch64 binaries. A -linux-gnu
      # binary always links glibc, so finding no version is an error (for
      # example readelf failing), never a pass.
      - name: Check glibc requirement (linux)
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          set -o pipefail
          max=2.35
          needed=$(readelf -W --version-info staging/surrealdb-plugin \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1) || needed=""
          if [ -z "$needed" ]; then
            echo "::error::Could not read a glibc version from surrealdb-plugin: readelf failed or listed none, and a ${{ matrix.target }} binary always needs one"
            exit 1
          fi
          echo "surrealdb-plugin needs glibc $needed; Tabularis needs $max"
          if [ "$(printf '%s\n%s\n' "$needed" "$max" | sort -V | tail -n 1)" != "$max" ]; then
            echo "::error::surrealdb-plugin needs glibc $needed, newer than the $max Tabularis targets on Linux"
            exit 1
          fi

      - name: Smoke test binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $response = '{"jsonrpc":"2.0","method":"initialize","id":1}' | & ".\staging\surrealdb-plugin${{ matrix.binary-suffix }}"
          Write-Output $response
          $parsed = $response | ConvertFrom-Json
          if ($null -ne $parsed.error) {
            Write-Error "Binary did not return a valid initialize response"
            exit 1
          }

      - name: Stash artifact
        uses: actions/upload-artifact@v7
        with:
          name: surrealdb-plugin-${{ matrix.platform-label }}
          path: surrealdb-plugin-${{ matrix.platform-label }}.zip
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    # Only for a pushed tag; a dry run stops after the builds.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for the .tabularium manifest asset)
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Detect prerelease from tag
        id: meta
        run: |
          # Auto-flag prerelease when the tag has a "-" suffix (semver
          # pre-release, e.g. v1.0.0-beta.1) — matches tabularis's own
          # release.yml convention.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Pull this version's section out of CHANGELOG.md so the GitHub
          # release body is the same hand-written prose we already maintain,
          # instead of shipping empty or relying on GitHub's auto-generated commit list.
          # A version's section runs from its "## [x.y.z]" heading to the
          # next one (or EOF for the oldest entry).
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v ver="$VERSION" '
            /^## \[/ {
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*/, "", line)
              if (capturing) { exit }
              if (line == ver) { capturing = 1; found = 1; next }
              next
            }
            capturing { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > /tmp/release-notes.raw.md || {
            echo "::error::No CHANGELOG.md section found for version $VERSION (expected a '## [$VERSION]' heading). Add one before tagging."
            exit 1
          }

          # Trim leading/trailing blank lines the section boundary leaves
          # behind, without collapsing intentional blank lines between bullets.
          awk 'NF{p=1} p' /tmp/release-notes.raw.md | tac | awk 'NF{p=1} p' | tac > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md section for version $VERSION is empty."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # .tabularium ships as a standalone asset: the registry resolves the
          # manifest from release assets, not the git ref.
          files: |
            artifacts/*.zip
            .tabularium
          body_path: /tmp/release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}
