[package]
name = "surrealdb-plugin"
version = "0.1.0"
edition = "2021"
description = "Tabularis driver plugin for SurrealDB"
license = "Apache-2.0"
repository = "https://github.com/TabularisDB/tabularis-surrealdb-plugin"
publish = false

[lib]
name = "surrealdb_plugin"
path = "src/lib.rs"

[[bin]]
name = "surrealdb-plugin"
path = "src/main.rs"

[[bin]]
name = "test_plugin"
path = "src/bin/test_plugin.rs"

[dependencies]
# SurrealDB is reached over its documented WebSocket RPC protocol with CBOR
# encoding instead of the `surrealdb` SDK crate. See docs/DESIGN.md.
ciborium = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
